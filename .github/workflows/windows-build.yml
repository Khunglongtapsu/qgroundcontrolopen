name: Build Windows G-Navron Control

on:
  workflow_dispatch:
  push:
    branches:
      - g-navron-windows-build

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      QT_VERSION: 6.6.3
      QT_ARCH: win64_msvc2019_64
      BUILD_TYPE: Release
      GSTREAMER_VERSION: 1.24.12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: qt5compat qtcharts qtconnectivity qtimageformats qtlocation qtmultimedia qtpositioning qtquick3d qtserialport qtshadertools qtsensors qtspeech qtwebsockets

      - name: Ensure ArduPilot parameter repository
        shell: powershell
        run: |
          $repoPath = "src\FirmwarePlugin\APM\ArduPilot-Parameter-Repository"
          $requiredFile = "$repoPath\Copter-4.3\apm.pdef.xml"

          Write-Host "Checking ArduPilot parameter repository..."

          if (!(Test-Path $requiredFile)) {
            Write-Host "Required file missing: $requiredFile"
            Write-Host "Trying git submodule update first..."
            git submodule sync --recursive
            git submodule update --init --recursive

            if (!(Test-Path $requiredFile)) {
              Write-Host "Submodule update did not provide required file. Re-cloning repository..."

              if (Test-Path $repoPath) {
                Remove-Item $repoPath -Recurse -Force
              }

              git clone https://github.com/ArduPilot/ArduPilot-Parameter-Repository.git $repoPath
            }
          }

          if (!(Test-Path $requiredFile)) {
            Write-Host "Listing parameter repository folder:"
            Get-ChildItem $repoPath -Recurse -ErrorAction SilentlyContinue | Select-Object -First 120 FullName
            throw "Still missing required ArduPilot parameter file: $requiredFile"
          }

          Write-Host "ArduPilot parameter repository OK: $requiredFile"


      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qt5compat qtcharts qtconnectivity qtimageformats qtlocation qtmultimedia qtpositioning qtquick3d qtserialport qtshadertools qtsensors qtspeech qtwebsockets

      - name: Install GStreamer runtime and development
        shell: powershell
        run: |
          $runtimeUrl = "https://github.com/Khunglongtapsu/qgroundcontrolopen/releases/download/gstreamer-1.26.9/gstreamer-1.0-msvc-x86_64-1.26.9.msi"
          $develUrl   = "https://github.com/Khunglongtapsu/qgroundcontrolopen/releases/download/gstreamer-1.26.9/gstreamer-1.0-devel-msvc-x86_64-1.26.9.msi"

          $runtimePath = "$env:RUNNER_TEMP\gstreamer-runtime.msi"
          $develPath   = "$env:RUNNER_TEMP\gstreamer-devel.msi"

          Write-Host "Downloading GStreamer runtime..."
          curl.exe -L --fail --retry 5 --retry-delay 5 -o "$runtimePath" "$runtimeUrl"

          Write-Host "Downloading GStreamer development..."
          curl.exe -L --fail --retry 5 --retry-delay 5 -o "$develPath" "$develUrl"

          Write-Host "Installing GStreamer runtime..."
          Start-Process msiexec.exe -Wait -ArgumentList @('/i', $runtimePath, '/qn', '/norestart')

          Write-Host "Installing GStreamer development..."
          Start-Process msiexec.exe -Wait -ArgumentList @('/i', $develPath, '/qn', '/norestart')

          $installedCandidates = @(
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\msvc_x86_64"
          )

          $installedRoot = $null
          foreach ($c in $installedCandidates) {
            if (Test-Path "$c\bin") {
              $installedRoot = $c
              break
            }
          }

          if ($null -eq $installedRoot) {
            throw "GStreamer installed root not found"
          }

          Write-Host "Detected installed GStreamer root: $installedRoot"

          # Copy to no-space path to avoid CMake/pkg-config splitting C:/Program Files into C:/Program
          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"

          if (Test-Path $gstRoot) {
            Remove-Item $gstRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "C:\gstreamer\1.0" | Out-Null
          Copy-Item -Path $installedRoot -Destination $gstRoot -Recurse -Force

          $gstRootUnix = "C:/gstreamer/1.0/msvc_x86_64"

          Write-Host "Rewriting pkg-config .pc files to no-space prefix..."

          $pcDirs = @(
            "$gstRoot\lib\pkgconfig",
            "$gstRoot\lib\gstreamer-1.0\pkgconfig"
          )

          foreach ($dir in $pcDirs) {
            if (Test-Path $dir) {
              Get-ChildItem $dir -Filter "*.pc" -Recurse | ForEach-Object {
                $content = Get-Content $_.FullName -Raw

                $content = $content `
                  -replace "C:/Program Files/gstreamer/1.0/msvc_x86_64", $gstRootUnix `
                  -replace "C:\\Program Files\\gstreamer\\1.0\\msvc_x86_64", "C:\gstreamer\1.0\msvc_x86_64" `
                  -replace [regex]::Escape($installedRoot.Replace("\", "/")), $gstRootUnix `
                  -replace [regex]::Escape($installedRoot), "C:\gstreamer\1.0\msvc_x86_64"

                Set-Content -Path $_.FullName -Value $content -Encoding ASCII
              }
            }
          }

          $pkgConfig = "$gstRoot\bin\pkg-config.exe"

          if (!(Test-Path $pkgConfig)) {
            throw "pkg-config.exe not found at $pkgConfig"
          }

          if (!(Test-Path "$gstRoot\lib\pkgconfig\glib-2.0.pc")) {
            throw "glib-2.0.pc not found at $gstRoot\lib\pkgconfig"
          }

          $env:PKG_CONFIG = $pkgConfig
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig"
          $env:PKG_CONFIG_LIBDIR = "$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"

          Write-Host "Testing pkg-config output..."
          & $pkgConfig --modversion glib-2.0
          & $pkgConfig --modversion gthread-2.0
          & $pkgConfig --modversion gstreamer-1.0

          Write-Host "GStreamer cflags:"
          & $pkgConfig --cflags gstreamer-1.0

          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot\" >> $env:GITHUB_ENV
          echo "GSTREAMER_ROOT_X86_64=$gstRoot\" >> $env:GITHUB_ENV
          echo "PKG_CONFIG=$pkgConfig" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig" >> $env:GITHUB_ENV
          echo "GSTREAMER_PLUGIN_PATH=$gstRoot\lib\gstreamer-1.0" >> $env:GITHUB_ENV
          echo "GST_PLUGIN_SYSTEM_PATH_1_0=$gstRoot\lib\gstreamer-1.0" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH

          Write-Host "GStreamer configured from no-space path: $gstRoot"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DQGC_ENABLE_BLUETOOTH=OFF -DQGC_ENABLE_UVC=OFF -DQGC_VIEWER3D=OFF -DQGC_ENABLE_QT_VIDEOSTREAMING=OFF -DQGC_ENABLE_GST_VIDEOSTREAMING=OFF

      - name: Patch GStreamer qsb external Ninja cycle
        shell: powershell
        run: |
          $ninjaFile = "build/build.ninja"

          if (!(Test-Path $ninjaFile)) {
            throw "build.ninja not found"
          }

          Write-Host "Patching qsb.external self dependency in build.ninja..."

          $lines = Get-Content $ninjaFile
          $out = New-Object System.Collections.Generic.List[string]
          $patched = 0

          foreach ($line in $lines) {
            if (($line -match '^build\s+') -and ($line -match '\.qsb\.external')) {
              $parts = $line -split ':', 2

              if ($parts.Count -eq 2) {
                $lhs = $parts[0]
                $rhs = $parts[1].Trim()

                $tokens = $rhs -split '\s+'

                if ($tokens.Count -gt 0) {
                  $rule = $tokens[0]
                  $deps = @()

                  if ($tokens.Count -gt 1) {
                    $deps = $tokens[1..($tokens.Count - 1)] | Where-Object {
                      $_ -and ($_ -notmatch '\.qsb\.external$')
                    }
                  }

                  if ($deps.Count -gt 0) {
                    $newLine = "${lhs}: $rule " + ($deps -join " ")
                  } else {
                    $newLine = "${lhs}: $rule"
                  }

                  $out.Add($newLine)
                  $patched++
                } else {
                  $out.Add($line)
                }
              } else {
                $out.Add($line)
              }
            } else {
              $out.Add($line)
            }
          }

          $out | Set-Content -Path $ninjaFile -Encoding ASCII

          Write-Host "Patched qsb.external build lines: $patched"
          Write-Host "Checking remaining qsb.external references:"
          Select-String -Path $ninjaFile -Pattern 'qsb\.external' | Select-Object -First 30

      - name: Generate missing GStreamer qsb external shader files
        shell: powershell
        run: |
          Write-Host "Generating missing GStreamer .qsb.external shader files..."

          $qsbCmd = Get-Command qsb.exe -ErrorAction SilentlyContinue

          if ($null -eq $qsbCmd) {
            Write-Host "qsb.exe not found in PATH. Searching workspace..."
            $qsbFile = Get-ChildItem -Path "D:\a" -Filter qsb.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $qsbFile) {
              throw "qsb.exe not found. Qt ShaderTools may not be installed correctly."
            }
            $qsb = $qsbFile.FullName
          } else {
            $qsb = $qsbCmd.Source
          }

          Write-Host "Using qsb: $qsb"

          $qrcFiles = Get-ChildItem -Path build -Filter "*.qrc" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "gstqml6gl" }

          if ($qrcFiles.Count -eq 0) {
            Write-Host "No gstqml6gl qrc files found."
            exit 0
          }

          $created = 0

          foreach ($qrc in $qrcFiles) {
            Write-Host "Scanning qrc: $($qrc.FullName)"
            $content = Get-Content $qrc.FullName -Raw

            $matches = [regex]::Matches($content, '([^<>"\s]+\.qsb\.external)')

            foreach ($m in $matches) {
              $ref = $m.Groups[1].Value

              if ([System.IO.Path]::IsPathRooted($ref)) {
                $externalPath = $ref
              } else {
                $externalPath = [System.IO.Path]::GetFullPath((Join-Path $qrc.DirectoryName $ref))
              }

              if (Test-Path $externalPath) {
                continue
              }

              $externalName = [System.IO.Path]::GetFileName($externalPath)
              $shaderName = $externalName -replace '\.qsb\.external$', ''

              Write-Host "Missing external shader: $externalPath"
              Write-Host "Looking for source shader: $shaderName"

              $sourceShader = Get-ChildItem -Path build -Filter $shaderName -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "gstreamer_good_plugins" -and $_.FullName -match "ext[\\/]+qt6" } |
                Select-Object -First 1

              if ($null -eq $sourceShader) {
                throw "Cannot find source shader for $shaderName"
              }

              $qsbPath = $externalPath -replace '\.external$', ''

              New-Item -ItemType Directory -Force -Path ([System.IO.Path]::GetDirectoryName($externalPath)) | Out-Null

              Write-Host "Compiling shader:"
              Write-Host "  Source: $($sourceShader.FullName)"
              Write-Host "  Output: $qsbPath"

              & $qsb --glsl "100 es,120,150" --hlsl 50 --msl 12 -o "$qsbPath" "$($sourceShader.FullName)"

              if ($LASTEXITCODE -ne 0) {
                throw "qsb failed for $($sourceShader.FullName)"
              }

              if (!(Test-Path $qsbPath)) {
                throw "qsb output not found: $qsbPath"
              }

              Copy-Item $qsbPath $externalPath -Force

              if (!(Test-Path $externalPath)) {
                throw "Failed to create external qsb file: $externalPath"
              }

              $created++
            }
          }

          Write-Host "Created missing .qsb.external files: $created"


      - name: Build
        shell: cmd
        run: |
          cmake --build build --config %BUILD_TYPE%

      - name: Find executable
        shell: powershell
        run: |
          Get-ChildItem -Path build -Filter *.exe -Recurse

      - name: Deploy Qt runtime and package
        shell: powershell
        run: |
          Write-Host "Creating clean Windows package using original exe name and windeployqt..."

          $packageDir = "G-Navron-Control-Windows"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Write-Host "Searching executable..."

          $exe = Get-ChildItem -Path build -Recurse -Filter "*.exe" |
            Where-Object {
              $_.Name -match "QGroundControl|G-Navron|GNavron"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Host "All exe files found:"
            Get-ChildItem -Path build -Recurse -Filter "*.exe" | Select-Object FullName
            throw "Cannot find built executable."
          }

          Write-Host "Found exe: $($exe.FullName)"
          Write-Host "Original exe name: $($exe.Name)"

          $targetExe = Join-Path $packageDir $exe.Name
          Copy-Item $exe.FullName $targetExe -Force

          $windeployqt = Get-Command windeployqt.exe -ErrorAction SilentlyContinue

          if ($null -eq $windeployqt) {
            Write-Host "windeployqt.exe not found in PATH. Searching Qt folder..."

            $windeployqtFile = Get-ChildItem -Path "D:\a" -Filter "windeployqt.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($null -eq $windeployqtFile) {
              throw "windeployqt.exe not found."
            }

            $windeployqtPath = $windeployqtFile.FullName
          } else {
            $windeployqtPath = $windeployqt.Source
          }

          Write-Host "Using windeployqt: $windeployqtPath"

          & $windeployqtPath `
            --release `
            --compiler-runtime `
            --qmldir "$env:GITHUB_WORKSPACE\src" `
            --dir $packageDir `
            $targetExe

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed."
          }

          Write-Host "Creating launcher bat..."

          $batLines = @(
            "@echo off",
            "cd /d ""%~dp0""",
            "",
            "echo Starting G-Navron Control using original exe name...",
            "echo App folder: %CD%",
            "",
            "set QT_PLUGIN_PATH=%CD%",
            "set QML2_IMPORT_PATH=%CD%\qml",
            "set QT_QPA_PLATFORM_PLUGIN_PATH=%CD%\platforms",
            "set QT_OPENGL=software",
            "set QT_QUICK_BACKEND=software",
            "set QSG_RHI_BACKEND=software",
            "",
            "echo.",
            "echo Checking files...",
            "if not exist ""$($exe.Name)"" echo MISSING: $($exe.Name)",
            "if not exist ""Qt6Core.dll"" echo MISSING: Qt6Core.dll",
            "if not exist ""platforms\qwindows.dll"" echo MISSING: platforms\qwindows.dll",
            "",
            "echo.",
            "echo Launching app...",
            """$($exe.Name)"" > gnavron_launch_log.txt 2>&1",
            "",
            "echo.",
            "echo App closed. Exit code: %ERRORLEVEL%",
            "echo Log saved to:",
            "echo %CD%\gnavron_launch_log.txt",
            "pause"
          )

          Set-Content -Path (Join-Path $packageDir "Run G-Navron Control.bat") -Value $batLines -Encoding ASCII

          Write-Host "Package content:"
          Get-ChildItem $packageDir | Select-Object Name, Length

          Compress-Archive -Path "$packageDir\*" -DestinationPath "G-Navron-Control-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-Navron-Control-Windows
          path: G-Navron-Control-Windows.zip
