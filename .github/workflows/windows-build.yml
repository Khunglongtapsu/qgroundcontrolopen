name: Build Windows G-Navron Control

on:
  workflow_dispatch:
  push:
    branches:
      - g-navron-windows-build

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      QT_VERSION: 6.6.3
      QT_ARCH: win64_msvc2019_64
      BUILD_TYPE: Release
      GSTREAMER_VERSION: 1.24.12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: qt5compat qtcharts qtlocation qtpositioning qtserialport qtmultimedia qtshadertools qtsensors qtspeech qtconnectivity

      - name: Install GStreamer runtime and development
        shell: powershell
        run: |
          $runtimeUrl = "https://github.com/Khunglongtapsu/qgroundcontrolopen/releases/download/gstreamer-1.26.9/gstreamer-1.0-msvc-x86_64-1.26.9.msi"
          $develUrl   = "https://github.com/Khunglongtapsu/qgroundcontrolopen/releases/download/gstreamer-1.26.9/gstreamer-1.0-devel-msvc-x86_64-1.26.9.msi"

          $runtimePath = "$env:RUNNER_TEMP\gstreamer-runtime.msi"
          $develPath   = "$env:RUNNER_TEMP\gstreamer-devel.msi"

          Write-Host "Downloading GStreamer runtime..."
          curl.exe -L --fail --retry 5 --retry-delay 5 -o "$runtimePath" "$runtimeUrl"

          Write-Host "Downloading GStreamer development..."
          curl.exe -L --fail --retry 5 --retry-delay 5 -o "$develPath" "$develUrl"

          Write-Host "Installing GStreamer runtime..."
          Start-Process msiexec.exe -Wait -ArgumentList @('/i', $runtimePath, '/qn', '/norestart')

          Write-Host "Installing GStreamer development..."
          Start-Process msiexec.exe -Wait -ArgumentList @('/i', $develPath, '/qn', '/norestart')

          $gstRoot = "C:\gstreamer\1.0\msvc_x86_64"

          if (!(Test-Path "$gstRoot\bin\pkg-config.exe")) {
            throw "pkg-config.exe not found at $gstRoot\bin\pkg-config.exe"
          }

          if (!(Test-Path "$gstRoot\lib\pkgconfig\glib-2.0.pc")) {
            throw "glib-2.0.pc not found after installing GStreamer development package"
          }

          if (!(Test-Path "$gstRoot\lib\pkgconfig\gthread-2.0.pc")) {
            throw "gthread-2.0.pc not found after installing GStreamer development package"
          }

          $env:PKG_CONFIG = "$gstRoot\bin\pkg-config.exe"
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig"
          $env:PKG_CONFIG_LIBDIR = "$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"

          & "$gstRoot\bin\pkg-config.exe" --modversion glib-2.0
          & "$gstRoot\bin\pkg-config.exe" --modversion gthread-2.0
          & "$gstRoot\bin\pkg-config.exe" --modversion gstreamer-1.0

          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot\" >> $env:GITHUB_ENV
          echo "GSTREAMER_ROOT_X86_64=$gstRoot\" >> $env:GITHUB_ENV
          echo "PKG_CONFIG=$gstRoot\bin\pkg-config.exe" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=$gstRoot\lib\pkgconfig;$gstRoot\lib\gstreamer-1.0\pkgconfig" >> $env:GITHUB_ENV
          echo "GSTREAMER_PLUGIN_PATH=$gstRoot\lib\gstreamer-1.0" >> $env:GITHUB_ENV
          echo "GST_PLUGIN_SYSTEM_PATH_1_0=$gstRoot\lib\gstreamer-1.0" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH

          Write-Host "GStreamer runtime + development installed successfully."

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=%BUILD_TYPE%

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config %BUILD_TYPE%

      - name: Find executable
        shell: powershell
        run: |
          Get-ChildItem -Path build -Filter *.exe -Recurse

      - name: Deploy Qt runtime and package
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path build -Filter QGroundControl.exe -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            throw "QGroundControl.exe not found"
          }

          $releaseDir = $exe.Directory.FullName
          Write-Host "Release dir: $releaseDir"

          windeployqt --release --qmldir "$env:GITHUB_WORKSPACE\src" "$($exe.FullName)"

          Rename-Item "$($exe.FullName)" "G-Navron Control.exe"

          $gstSrc = "C:\gstreamer\1.0\msvc_x86_64"
          $gstDst = Join-Path $releaseDir "gstreamer\1.0\msvc_x86_64"

          New-Item -ItemType Directory -Force -Path $gstDst | Out-Null

          Write-Host "Copying GStreamer runtime into package..."

          robocopy "$gstSrc\bin" "$gstDst\bin" /E
          if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 } else { exit $LASTEXITCODE }

          robocopy "$gstSrc\lib\gstreamer-1.0" "$gstDst\lib\gstreamer-1.0" /E
          if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 } else { exit $LASTEXITCODE }

          if (Test-Path "$gstSrc\lib\gio") {
            robocopy "$gstSrc\lib\gio" "$gstDst\lib\gio" /E
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 } else { exit $LASTEXITCODE }
          }

          if (Test-Path "$gstSrc\share") {
            robocopy "$gstSrc\share" "$gstDst\share" /E
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 } else { exit $LASTEXITCODE }
          }

          $launcherPath = Join-Path $releaseDir "Run G-Navron Control.bat"

          @"
          @echo off
          set APPDIR=%~dp0
          set GSTREAMER_1_0_ROOT_MSVC_X86_64=%APPDIR%gstreamer\1.0\msvc_x86_64\
          set PATH=%GSTREAMER_1_0_ROOT_MSVC_X86_64%bin;%PATH%
          set GST_PLUGIN_PATH=%GSTREAMER_1_0_ROOT_MSVC_X86_64%lib\gstreamer-1.0
          set GST_PLUGIN_SYSTEM_PATH_1_0=%GSTREAMER_1_0_ROOT_MSVC_X86_64%lib\gstreamer-1.0
          start "" "%APPDIR%G-Navron Control.exe"
          "@ | Set-Content -Encoding ASCII $launcherPath

          Compress-Archive -Path "$releaseDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\G-Navron-Control-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G-Navron-Control-Windows
          path: G-Navron-Control-Windows.zip
